- name: int_concept_map
  description: Pre-resolved (source -> standard) concept mappings used by get_concept_ids macro. Materialized as table for
    fast lookup.
  config:
    schema: omop
  columns:
  - name: source_concept_id
    data_type: integer
  - name: source_domain_id
    data_type: varchar
  - name: source_vocabulary_id
    data_type: varchar
  - name: target_concept_id
    data_type: integer
  - name: target_vocabulary_id
    data_type: varchar
  - name: relationship_id
    data_type: varchar
    description: '''identity'' for standard-self, otherwise the concept_relationship.relationship_id (currently ''Maps to''
      or ''Maps to value'').'
- name: int_payer_plan_period
  description: Type-cast wrapper around stg_payer_plan_period.
  config:
    schema: omop
- name: int_visit_occurrence_id_map
  description: Stable surrogate-key remap from the bill_id-derived visit_occurrence_id to a sequential 1..N integer.
  config:
    schema: omop
- name: int_visit_detail_id_map
  description: Stable surrogate-key remap for visit_detail_id (mirror of int_visit_occurrence_id_map).
  config:
    schema: omop
- name: int_cost
  description: Type-cast wrapper around stg_cost. Resolves revenue_code_concept_id and drg_concept_id from their source codes.
  config:
    schema: omop
- name: int_drug_exposure
  description: Type-cast wrapper around stg_drug_exposure. Resolves drug_source_concept_id (NDC/HCPCS).
  config:
