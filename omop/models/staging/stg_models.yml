version: 2
models:
- name: stg_person
  config:
    schema: omop
  columns:
  - name: person_id
    data_type: integer
  - name: gender_concept_id
    data_type: integer
  - name: year_of_birth
    data_type: integer
  - name: month_of_birth
    data_type: integer
  - name: day_of_birth
    data_type: integer
  - name: birth_datetime
    data_type: timestamp
  - name: race_concept_id
    data_type: integer
  - name: ethnicity_concept_id
    data_type: integer
  - name: location_id
    data_type: integer
  - name: provider_id
    data_type: integer
  - name: care_site_id
    data_type: integer
  - name: person_source_value
    data_type: varchar
  - name: gender_source_value
    data_type: varchar
  - name: gender_source_concept_id
    data_type: integer
  - name: race_source_value
    data_type: varchar
  - name: race_source_concept_id
    data_type: integer
  - name: ethnicity_source_value
    data_type: varchar
  - name: ethnicity_source_concept_id
    data_type: integer
  description: Unique persons unioned from header tables across all three claim types (institutional, professional, pharmacy)
    and both current/historical. Deduplicates on a hash-derived person_id, preferring the most complete demographic record.
- name: stg_visit_occurrence
  config:
    schema: omop
  columns:
  - name: visit_occurrence_id
    data_type: integer
  - name: person_id
    data_type: integer
  - name: visit_concept_id
    data_type: integer
  - name: visit_start_date
    data_type: date
  - name: visit_start_datetime
    data_type: datetime
  - name: visit_end_date
    data_type: date
  - name: visit_end_datetime
    data_type: datetime
  - name: visit_type_concept_id
    data_type: integer
  - name: provider_id
    data_type: integer
  - name: care_site_id
    data_type: integer
  - name: visit_source_value
    data_type: varchar(50)
  - name: visit_source_concept_id
    data_type: integer
  - name: admitted_from_concept_id
    data_type: integer
  - name: admitted_from_source_value
    data_type: varchar(50)
  - name: discharged_to_concept_id
    data_type: integer
  - name: discharged_to_source_value
    data_type: varchar(50)
  - name: preceding_visit_occurrence_id
    data_type: integer
  description: Visits unioned from header tables across claim types. Each bill becomes one visit_occurrence_id.
- name: stg_condition_occurrence
  config:
    schema: omop
  columns:
  - name: condition_occurrence_id
    data_type: integer
  - name: person_id
    data_type: integer
  - name: condition_concept_id
    data_type: integer
  - name: condition_start_date
    data_type: date
  - name: condition_start_datetime
    data_type: datetime
  - name: condition_end_date
    data_type: date
  - name: condition_end_datetime
    data_type: datetime
  - name: condition_type_concept_id
    data_type: integer
  - name: condition_status_concept_id
    data_type: integer
  - name: stop_reason
    data_type: varchar(20)
  - name: provider_id
    data_type: integer
  - name: visit_occurrence_id
    data_type: integer
  - name: visit_detail_id
    data_type: integer
  - name: condition_source_value
    data_type: varchar(50)
  - name: condition_source_concept_id
    data_type: integer
  - name: condition_status_source_value
    data_type: varchar(50)
  description: Diagnoses unpivoted from per-claim ICD-9/ICD-10 diagnosis-code columns across header/detail tables.
- name: stg_procedure_occurrence
  config:
