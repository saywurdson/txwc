- name: stg_observation
  config:
    schema: omop
  columns:
  - name: observation_id
    data_type: integer
  - name: person_id
    data_type: integer
  - name: observation_concept_id
    data_type: integer
  - name: observation_date
    data_type: date
  - name: observation_datetime
    data_type: datetime
  - name: observation_type_concept_id
