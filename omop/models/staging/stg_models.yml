- name: stg_location
  config:
    schema: omop
  columns:
  - name: location_id
    data_type: integer
  - name: address_1
    data_type: varchar(50)
  - name: address_2
    data_type: varchar(50)
  - name: city
    data_type: varchar(50)
  - name: state
    data_type: varchar(2)
  - name: zip
    data_type: varchar(9)
  - name: county
    data_type: varchar(20)
  - name: location_source_value
    data_type: varchar(50)
  - name: country_concept_id
    data_type: integer
  - name: country_source_value
    data_type: varchar(80)
  - name: latitude
    data_type: float
  - name: longitude
    data_type: float
  description: Geographic locations derived from employee mailing addresses (person locations) and facility addresses (care-site
    locations) across claim types.
- name: stg_care_site
  config:
    schema: omop
  columns:
  - name: care_site_id
    data_type: integer
  - name: care_site_name
    data_type: varchar(255)
  - name: place_of_service_concept_id
    data_type: integer
  - name: location_id
    data_type: integer
  - name: care_site_source_value
    data_type: varchar(50)
  - name: place_of_service_source_value
    data_type: varchar(50)
  description: Care sites (facilities) derived from facility/billing-provider identifiers in header tables across claim types.
- name: stg_provider
  config:
    schema: omop
  columns:
  - name: provider_id
    data_type: integer
  - name: provider_name
    data_type: varchar(255)
  - name: npi
    data_type: varchar(20)
  - name: dea
    data_type: varchar(20)
  - name: specialty_concept_id
    data_type: integer
  - name: care_site_id
    data_type: integer
  - name: year_of_birth
    data_type: integer
  - name: gender_concept_id
    data_type: integer
  - name: provider_source_value
    data_type: varchar(50)
  - name: specialty_source_value
    data_type: varchar(50)
  - name: specialty_source_concept_id
    data_type: integer
  - name: gender_source_value
    data_type: varchar(50)
  - name: gender_source_concept_id
    data_type: integer
  description: Rendering providers derived from provider identifiers in header tables. Includes specialty when the source
    column exists (current files only for some claim types).
- name: stg_visit_detail
  description: Visit detail records (sub-visit transfers/services) unioned from detail tables across claim types.
  config:
    schema: omop
- name: stg_drug_exposure
  description: Drug administrations and dispensings derived from pharmacy-detail (NDC) and institutional/professional-detail
    (HCPCS) tables.
  config:
    schema: omop
- name: stg_cost
  description: Itemized cost records derived from amount fields in header and detail tables across claim types.
  config:
    schema: omop
- name: stg_payer_plan_period
  description: Payer/plan coverage periods derived from claim header reporting periods.
  config:
    schema: omop
