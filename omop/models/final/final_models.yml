version: 2
models:
- name: person
  config:
    schema: omop
  columns:
  - name: person_id
    data_type: integer
    data_tests:
    - unique
    - not_null
  - name: gender_concept_id
    data_type: integer
    data_tests:
    - accepted_values:
        arguments:
          values:
          - 8507
          - 8532
          - 0
          quote: false
  - name: year_of_birth
    data_type: integer
    data_tests:
    - dbt_utils.expression_is_true:
        arguments:
          expression: between 1900 and extract(year from current_date)
  - name: month_of_birth
    data_type: integer
  - name: day_of_birth
    data_type: integer
  - name: birth_datetime
    data_type: timestamp
  - name: race_concept_id
    data_type: integer
  - name: ethnicity_concept_id
    data_type: integer
  - name: location_id
    data_type: integer
    data_tests:
    - relationships:
        arguments:
          to: ref('location')
          field: location_id
  - name: provider_id
    data_type: integer
    data_tests:
    - relationships:
        arguments:
          to: ref('provider')
          field: provider_id
  - name: care_site_id
    data_type: integer
    data_tests:
    - relationships:
        arguments:
          to: ref('care_site')
          field: care_site_id
  - name: person_source_value
    data_type: varchar
  - name: gender_source_value
    data_type: varchar
  - name: gender_source_concept_id
    data_type: integer
  - name: race_source_value
    data_type: varchar
  - name: race_source_concept_id
    data_type: integer
  - name: ethnicity_source_value
    data_type: varchar
  - name: ethnicity_source_concept_id
    data_type: integer
  description: Demographics for each unique individual whose data is in the database. One row per person.
